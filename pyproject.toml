[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-multi-agent-demo"
version = "0.1.0"
description = "Educational five-agent stock analysis demo with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "numpy>=2.0,<3.0",
  "neo4j>=6.0,<7.0",
  "pandas>=2.2,<4.0",
  "pydantic>=2.10,<3.0",
  "plotly>=6.0,<7.0",
  "streamlit>=1.40,<2.0",
  "vnstock>=4.0,<5.0",
]

[project.optional-dependencies]
llm = ["openai>=2.0,<3.0"]
ml = ["tensorflow>=2.20,<2.22"]
knowledge = ["pypdf>=5.0,<7.0"]
dev = ["pytest>=8.0,<10.0", "pytest-cov>=5.0,<8.0"]

[project.scripts]
stock-agents = "stock_multi_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_multi_agent"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
